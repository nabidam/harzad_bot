<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0d1e" id="meta-theme"/>
<title>Harzad</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ==========================================================================
   Harzad Mini App
   Brand tokens sampled from assets/logo.png: navy ink #1A1E3D, cream #FBEEDB,
   electric cyan #3AE3FD (spec §12: the Mini App shares the bot's accent).
   Icons: Tabler Icons (MIT). Paths are inlined because this is a no-build
   single-file app served at the registered Mini App origin.
   Theme: dark by default. Outside Telegram it follows prefers-color-scheme;
   inside Telegram it follows the user's Telegram surface (themeParams
   luminance). The palette is the app's own in both cases: we set the
   Telegram header/background to match, we do not mirror arbitrary theme
   colors (the old behavior made the app a coat-hanger for user themes).
   Z-index scale (systemic, do not add ad-hoc values):
     5  sticky chip bar        30  mini player
     40  sheet backdrop        50  track sheet
     60  toast
   ========================================================================== */
:root{
  color-scheme:dark;
  --page:#05070f;
  --bg:#0a0d1e;
  --bg-2:#0e1329;
  --surface:#141a35;
  --surface-2:#1c2344;
  --text:#f2eee3;
  --text-2:#a7aed0;
  --text-3:#7c84b0;
  --line:rgba(167,174,208,.13);
  --line-2:rgba(167,174,208,.28);
  --accent:#3ae3fd;
  --accent-2:#8befff;
  --on-accent:#051219;
  --accent-soft:rgba(58,227,253,.12);
  --accent-ring:rgba(58,227,253,.4);
  --danger:#ff7d72;
  --danger-soft:rgba(255,125,114,.13);
  --danger-ink:#2a0b07;
  --ok:#4be0a5;
  --ok-soft:rgba(75,224,165,.15);
  --scrim:rgba(3,5,14,.66);
  --shadow-1:0 10px 28px rgba(2,4,12,.5);
  --shadow-2:0 20px 50px rgba(2,4,12,.6);
  --r-s:10px;
  --r-m:14px;
  --r-l:20px;
  --ease:cubic-bezier(.32,.72,0,1);
  --tab-h:58px;
}
:root.light{
  color-scheme:light;
  --page:#e8eaf2;
  --bg:#f3f4f9;
  --bg-2:#fafbfe;
  --surface:#fdfdff;
  --surface-2:#edeff7;
  --text:#151a3d;
  --text-2:#4c537d;
  --text-3:#646a90;
  --line:rgba(21,26,61,.1);
  --line-2:rgba(21,26,61,.24);
  --accent:#077490;
  --accent-2:#0a89ab;
  --on-accent:#f5feff;
  --accent-soft:rgba(7,116,144,.1);
  --accent-ring:rgba(7,116,144,.35);
  --danger:#c53a30;
  --danger-soft:rgba(197,58,48,.1);
  --danger-ink:#fdf1ef;
  --ok:#0f9d6c;
  --ok-soft:rgba(15,157,108,.12);
  --scrim:rgba(21,26,61,.42);
  --shadow-1:0 10px 28px rgba(21,26,61,.14);
  --shadow-2:0 20px 50px rgba(21,26,61,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--page);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ico{display:block;flex:none}

.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media (min-width:520px){
  .app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 80px rgba(0,0,0,.35)}
}

/* ---- top bar ----------------------------------------------------------- */
.topbar{
  flex:none;height:calc(52px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 16px 0;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg-2);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px}
.brand img{width:27px;height:27px;border-radius:8px;display:block}
.brand b{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.avatar{
  width:28px;height:28px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);
  font-size:12px;font-weight:700;
}
.avatar .ico{width:15px;height:15px;color:var(--text-3)}

/* ---- main + tabs -------------------------------------------------------- */
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px;-webkit-overflow-scrolling:touch}
.tab{display:none;padding:18px 0 28px}
.tab.active{display:block;animation:tab-in .22s var(--ease)}
@keyframes tab-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
body.chat-on main{padding-bottom:0}
body.chat-on #tab-chat{padding-bottom:96px}

.hero h1{font-size:23px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.hero p{margin:0 0 16px;font-size:13.5px;color:var(--text-2)}

/* ---- cards / buttons / fields ------------------------------------------ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:15px;margin-bottom:12px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:48px;padding:0 16px;border:1px solid transparent;
  border-radius:var(--r-s);background:var(--surface-2);color:var(--text);
  font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;user-select:none;
  transition:transform .12s var(--ease),background .15s,opacity .15s;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .ico{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:active{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:var(--line-2)}
.btn.ghost.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger-solid{background:var(--danger);color:var(--danger-ink)}
.btn .spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.row2 .btn{height:44px;font-size:13.5px}
.hint{font-size:12px;color:var(--text-3);margin-top:10px}
.num{font-variant-numeric:tabular-nums}

.urlrow{
  display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;
  background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-s);
  transition:border-color .15s,box-shadow .15s;
}
.urlrow:focus-within{border-color:var(--accent-ring);box-shadow:0 0 0 3px var(--accent-soft)}
.urlrow .ico{width:19px;height:19px;color:var(--text-3)}
.urlrow input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.urlrow input::placeholder{color:var(--text-3)}
.platforms{font-size:12px;color:var(--text-3);margin:10px 2px 12px}
.form-err{
  display:flex;align-items:flex-start;gap:8px;margin-top:12px;
  background:var(--danger-soft);border:1px solid var(--danger);
  border-radius:var(--r-s);padding:10px 12px;font-size:13px;color:var(--danger);
}
.form-err .ico{width:17px;height:17px;margin-top:1px}

/* ---- download task ------------------------------------------------------ */
.task-row{display:flex;align-items:center;gap:12px}
.task-ico{
  width:42px;height:42px;border-radius:12px;flex:none;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
}
.task-ico .ico{width:21px;height:21px}
.task-ico.ok{background:var(--ok-soft);color:var(--ok)}
.task-ico.warn{background:var(--danger-soft);color:var(--danger)}
.task-body{flex:1;min-width:0}
.task-label{font-size:14.5px;font-weight:600}
.task-elapsed{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3);margin-top:2px}
.task-elapsed .ico{width:13px;height:13px}
.bar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.bar-fill{
  display:block;height:100%;width:38%;border-radius:inherit;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:bar-slide 1.25s var(--ease) infinite;
}
@keyframes bar-slide{from{transform:translateX(-110%)}to{transform:translateX(380%)}}
.result-head{display:flex;align-items:flex-start;gap:12px}
.result-head .task-body .task-label{font-size:15px}
.result-meta{font-size:12.5px;color:var(--text-3);margin-top:2px;word-break:break-all}
.result .btn{margin-top:12px}

/* ---- music tab ---------------------------------------------------------- */
.music-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.music-head h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
.music-count{font-size:12.5px;color:var(--text-3);text-align:right}
.chipbar{position:sticky;top:-18px;z-index:5;margin:0 -16px;padding:10px 16px;background:var(--bg)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);
  border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;
  transition:background .15s,color .15s,border-color .15s,transform .12s var(--ease);
}
.chip:active{transform:scale(.96)}
.chip.active{background:var(--accent-soft);border-color:var(--accent-ring);color:var(--accent)}
.chip.back{margin-top:10px;display:inline-flex;align-items:center;gap:6px}
.chip.back .ico{width:15px;height:15px}
.chips+.chip{margin-top:10px}
.searchrow{
  display:flex;align-items:center;gap:8px;margin-top:12px;
}
.searchrow .urlrow{flex:1;height:46px}
.searchrow .go{
  flex:none;width:46px;height:46px;border-radius:var(--r-s);border:0;cursor:pointer;
  background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  transition:transform .12s var(--ease),background .15s;
}
.searchrow .go:active{transform:scale(.94);background:var(--accent-2)}
.searchrow .go .ico{width:19px;height:19px}
.field-err{font-size:12.5px;color:var(--danger);margin:8px 2px 0}
#day-list{margin-top:12px}
.dayrow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:12px 14px;margin-bottom:8px;cursor:pointer;user-select:none;
  transition:transform .12s var(--ease),border-color .15s;
}
.dayrow:active{transform:scale(.985);border-color:var(--accent-ring)}
.dayrow .dico{
  width:36px;height:36px;border-radius:10px;flex:none;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
}
.dayrow .dico .ico{width:17px;height:17px}
.dayrow .dl{font-size:14px;font-weight:600}
.dayrow .ds{font-size:12px;color:var(--text-3);margin-top:1px}
.dayrow .chev{margin-left:auto;color:var(--text-3)}
.dayrow .chev .ico{width:18px;height:18px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;margin-top:14px}
.tile{cursor:pointer;user-select:none;transition:transform .12s var(--ease);animation:tile-in .34s var(--ease) both;animation-delay:calc(var(--i,0)*26ms)}
.tile:active{transform:scale(.96)}
@keyframes tile-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.coverwrap{position:relative;border-radius:var(--r-m);overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.coverwrap img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.letter{
  width:100%;aspect-ratio:1;display:grid;place-items:center;
  font-size:28px;font-weight:700;color:var(--accent);
  background:
    radial-gradient(120% 120% at 20% 0%,var(--accent-soft) 0%,transparent 55%),
    var(--surface-2);
}
.dur{
  position:absolute;right:6px;bottom:6px;
  background:rgba(5,8,20,.72);color:#fff;
  font-size:10.5px;font-weight:600;border-radius:6px;padding:1.5px 5px;
  font-variant-numeric:tabular-nums;
}
.tile .tt{margin-top:7px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ta{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#load-more{margin-top:14px}

/* skeleton */
.skel{pointer-events:none}
.skel .sk-cover{border-radius:var(--r-m);aspect-ratio:1;margin-bottom:8px}
.skel .sk-l1{height:11px;width:82%;border-radius:5px;margin-bottom:6px}
.skel .sk-l2{height:9px;width:58%;border-radius:5px}
.sk{
  background:linear-gradient(100deg,var(--surface) 40%,var(--surface-2) 50%,var(--surface) 60%);
  background-size:200% 100%;animation:shimmer 1.3s ease-in-out infinite;
}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-80% 0}}

/* empty / error state boxes */
.statebox{padding:44px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.state-ico{
  width:52px;height:52px;border-radius:16px;margin-bottom:12px;
  display:grid;place-items:center;
}
.state-ico .ico{width:25px;height:25px}
.state-ico.soft{background:var(--accent-soft);color:var(--accent)}
.state-ico.warn{background:var(--danger-soft);color:var(--danger)}
.state-t{font-size:15px;font-weight:600;margin-bottom:4px}
.state-d{font-size:13px;color:var(--text-2);max-width:270px}
.statebox .btn{max-width:180px;margin-top:14px;height:44px}

/* ---- track sheet -------------------------------------------------------- */
.sheet-backdrop{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .24s}
.sheet-backdrop.open{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  max-width:480px;margin:0 auto;
  background:var(--surface);border:1px solid var(--line);border-bottom:0;
  border-radius:var(--r-l) var(--r-l) 0 0;
  padding:10px 18px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .3s var(--ease);
  max-height:88dvh;overflow-y:auto;box-shadow:var(--shadow-2);
}
.sheet.open{transform:none}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line-2);margin:2px auto 12px}
.sheet-x{
  position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
  border:0;background:var(--surface-2);color:var(--text-2);cursor:pointer;
  display:grid;place-items:center;
}
.sheet-x .ico{width:16px;height:16px}
.sheet-head{display:flex;gap:14px;align-items:center;padding-right:36px}
.sheet-cover{width:72px;height:72px;border-radius:12px;overflow:hidden;flex:none;border:1px solid var(--line)}
.sheet-cover .letter{font-size:28px}
.twrap{flex:1;min-width:0}
#sheet-title{margin:0;font-size:16px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sheet-artist{font-size:13px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet-album{font-size:12px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:16px 0 4px}
.stat b{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:2px}
.stat span{font-size:13px;font-weight:600}
.minirow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.minirow .btn{height:44px;font-size:12.5px;padding:0 6px}
.minirow .btn .ico{width:16px;height:16px}
#sheet-resend{margin-top:14px}
.sheet-confirm{margin-top:14px}
.sheet-confirm p{margin:0 0 10px;font-size:13.5px;color:var(--text-2);line-height:1.45}
.sheet-confirm .minirow{margin-top:0;grid-template-columns:1fr 1fr}
.sheet-status{
  display:flex;align-items:flex-start;gap:8px;margin-top:12px;
  font-size:13px;color:var(--text-2);min-height:0;
}
.sheet-status .ico{width:16px;height:16px;margin-top:1.5px}
.sheet-status.done{color:var(--ok)}
.sheet-status.done .ico{color:var(--ok)}
.sheet-status.error{color:var(--danger)}
.sheet-status.error .ico{color:var(--danger)}
.sheet-status.busy .ico{color:var(--accent);animation:spin .9s linear infinite}

/* ---- mini player -------------------------------------------------------- */
.playerbar{
  position:absolute;left:12px;right:12px;z-index:30;
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 10px);
  display:flex;align-items:center;gap:11px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-m);
  padding:9px 10px 9px 12px;box-shadow:var(--shadow-1);
  animation:tab-in .22s var(--ease);
}
body.chat-on .playerbar{bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 80px)}
.pb-cover{width:36px;height:36px;border-radius:9px;overflow:hidden;flex:none;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.pb-cover .ico{width:17px;height:17px}
.pb-cover img{width:100%;height:100%;object-fit:cover;display:block}
.pb-body{flex:1;min-width:0}
.pb-title{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.pb-btn{
  flex:none;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  transition:transform .12s var(--ease);
}
.pb-btn:active{transform:scale(.92)}
.pb-btn .ico{width:18px;height:18px}

/* ---- chat tab ----------------------------------------------------------- */
.msgs{display:flex;flex-direction:column;gap:9px;padding-top:4px}
.msg{
  max-width:80%;padding:10px 13px;border-radius:16px;
  font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;
  animation:tab-in .2s var(--ease);
}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);font-weight:500;border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.typing{display:inline-flex;gap:4px;align-items:center;padding:2px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:.9;transform:translateY(-2px)}}
.composer{
  position:absolute;left:0;right:0;z-index:20;
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--bg-2);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:9px;
}
.composer input{
  flex:1;min-width:0;height:46px;border-radius:999px;
  background:var(--surface-2);border:1px solid transparent;outline:0;
  padding:0 16px;font-size:15px;
  transition:border-color .15s,box-shadow .15s;
}
.composer input:focus{border-color:var(--accent-ring);box-shadow:0 0 0 3px var(--accent-soft)}
.composer input::placeholder{color:var(--text-3)}
.composer .send{
  flex:none;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  transition:transform .12s var(--ease),opacity .15s;
}
.composer .send:active{transform:scale(.92)}
.composer .send:disabled{opacity:.45;pointer-events:none}
.composer .send .ico{width:19px;height:19px}

/* ---- tab bar ------------------------------------------------------------ */
.tabbar{
  flex:none;display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--bg-2);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  position:relative;background:none;border:0;cursor:pointer;
  color:var(--text-3);padding:10px 0 9px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:11px;font-weight:600;user-select:none;
  transition:color .18s;
}
.tabbar button:active{transform:scale(.97)}
.tabbar .nav-ico{height:23px;display:grid;place-items:center}
.tabbar .nav-ico .ico{width:23px;height:23px}
.tabbar button.active{color:var(--accent)}
.tabbar button.active::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:20px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);
}

/* ---- toast --------------------------------------------------------------- */
.toast{
  position:fixed;left:50%;z-index:60;
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);
  transform:translate(-50%,8px);
  max-width:min(88vw,420px);

  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

<script>
"use strict";
/* ==========================================================================
   Runs inside Telegram's WebView and in a plain browser (preview mode).
   Outside Telegram the SDK script may be missing entirely, so every tg
   access is guarded.
   ========================================================================== */
const tg = (window.Telegram && window.Telegram.WebApp) || null;
const inTG = !!(tg && tg.initData && tg.initData.length);

// ---- theme ---------------------------------------------------------------
// Brand palette in both modes; detect the user's surface only (see header).
function detectDark(){
  if (inTG && tg.themeParams && typeof tg.themeParams.bg_color === "string") {
    const m = tg.themeParams.bg_color.match(/#?([0-9a-f]{6})/i);
    if (m) {
      const n = parseInt(m[1], 16);
      const lum = (0.2126 * (n >> 16 & 255) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) / 255;
      return lum < 0.5;
    }
  }
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function applyTheme(){
  const dark = detectDark();
  document.documentElement.classList.toggle("light", !dark);
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  const meta = $("meta-theme");
  if (meta) meta.setAttribute("content", bg);
  if (tg && tg.setHeaderColor) {
    try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
  }
}
function bootTg(){
  if (tg) {
    try {
      tg.ready();
      tg.expand();
    } catch (e) {}
  }
  applyTheme();
  if (tg) tg.onEvent("themeChanged", applyTheme);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (!inTG) applyTheme();
  });
}

// ---- icons (Tabler Icons, MIT; inlined for the no-build single file) -----
const SVGNS = "http://www.w3.org/2000/svg";
const ICONS = {
  "music": ["M3 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0","M13 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0","M9 17v-13h10v13","M9 8h10"],
  "circle-check": ["M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0","M9 12l2 2l4 -4"],
  "external-link": ["M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6","M11 13l9 -9","M15 4h5v5"],
  "refresh": ["M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4","M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"],
  "clock": ["M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0","M12 7v5l3 3"],
  "lock": ["M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6","M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0","M8 11v-4a4 4 0 1 1 8 0v4"],
  "player-pause": ["M6 6a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -12","M14 6a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -12"],
  "player-play": ["M7 4v16l13 -8l-13 -8"],
  "chevron-right": ["M9 6l6 6l-6 6"],
  "chevron-left": ["M15 6l-6 6l6 6"],
  "link": ["M9 15l6 -6","M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464","M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463"],
  "x": ["M18 6l-12 12","M6 6l12 12"],
  "loader-2": ["M12 3a9 9 0 1 0 9 9"],
  "trash": ["M4 7l16 0","M10 11l0 6","M14 11l0 6","M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12","M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"],
  "search": ["M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0","M21 21l-6 -6"],
  "calendar": ["M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12","M16 3v4","M8 3v4","M4 11h16"],
  "send": ["M10 14l11 -11","M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5"],
  "alert-circle": ["M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0","M12 8v4","M12 16h.01"],
  "cloud-off": ["M9.58 5.548c.24 -.11 .492 -.207 .752 -.286c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 .957 -.383 1.824 -1.003 2.454m-2.997 1.033h-11.343c-2.572 -.004 -4.657 -2.011 -4.657 -4.487c0 -2.475 2.085 -4.482 4.657 -4.482c.13 -.582 .37 -1.128 .7 -1.62","M3 3l18 18"],
  "download": ["M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2","M7 11l5 5l5 -5","M12 4l0 12"],
  "cloud-download": ["M19 18a3.5 3.5 0 0 0 0 -7h-1a5 4.5 0 0 0 -11 -2a4.6 4.4 0 0 0 -2.1 8.4","M12 13l0 9","M9 19l3 3l3 -3"],
  "message": ["M8 9h8","M8 13h6","M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12"]
};
function icon(name){
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  svg.classList.add("ico");
  (ICONS[name] || []).forEach((d) => {
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", d);
    svg.appendChild(p);
  });
  return svg;
}
function mountIcon(holder, name, cls){
  holder.innerHTML = "";
  const s = icon(name);
  if (cls) s.classList.add(cls);
  holder.appendChild(s);
  return s;
}

const $ = (id) => document.getElementById(id);
const state = { user: null, currentJob: null, result: null, messages: [] };
let jobStart = 0;
let elapsedTimer = null;

// ---- api + haptics + toast -----------------------------------------------
async function api(path, body){
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}
function haptic(kind){
  try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(kind); } catch (e) {}
}
let toastTimer = null;
function toast(msg, ms){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), ms || 2600);
}
function esc(s){
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

// ---- tabs ------------------------------------------------------------------
function setTab(tab){
  document.querySelectorAll(".tabbar button").forEach((x) =>
    x.classList.toggle("active", x.dataset.tab === tab));
  document.querySelectorAll(".tab").forEach((s) =>
    s.classList.toggle("active", s.id === "tab-" + tab));
  $("composer").hidden = tab !== "chat";
  document.body.classList.toggle("chat-on", tab === "chat");
  $("main").scrollTop = 0;
  if (tab === "chat" && state.messages.length === 0) {
    // Same wording as the bot's AI chat screen (spec §9/§12.2): no
    // conversation memory, so each message stands on its own.
    addMsg("bot", "Ask me a question. I answer each message independently for now, so include any context I need in each message.");
  }
  if (tab === "music") enterMusic();
}
document.querySelectorAll(".tabbar button").forEach((b) =>
  b.addEventListener("click", () => setTab(b.dataset.tab)));

// ---- auth ------------------------------------------------------------------
function renderUser(){
  const av = $("user-avatar");
  const txt = av.querySelector(".av-txt");
  if (state.user) {
    const first = state.user.first_name || "";
    $("greet").textContent = "Hi, " + first;
    txt.textContent = (first[0] || "?").toUpperCase();
    av.title = [state.user.first_name, state.user.last_name].filter(Boolean).join(" ");
  } else {
    $("greet").textContent = "Hi there";
    txt.textContent = "";
    av.title = "Browser mode";
    mountIcon(av, "cloud-off");
    $("mode-hint").hidden = false;
  }
}
async function boot(){
  try {
    const data = await api("/api/auth", { initData: inTG ? tg.initData : "" });
    state.user = data.user || null;
  } catch (e) {
    state.user = null;
  }
  renderUser();
}

// ---- download tab ----------------------------------------------------------
// State labels share the bot's status vocabulary (spec §12/§12.2).
const STATE_LABEL = {
  starting: "Checking link…",
  extracting: "Getting media details…",
  downloading: "Downloading…",
  sending: "Sending to chat…",
  done: "Ready",
};
const COPY = {
  failed: "This download failed. Check the link or try again.",
  expired: "This download link may have expired. Generate a new one to continue.",
};

function fmtElapsed(s){
  if (s < 60) return s + "s";
  return Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
}
// Elapsed time is measured client-side from job creation and only shown
// after 5 seconds (spec §4.1: show measured elapsed time, never simulate).
function startElapsed(){
  jobStart = Date.now();
  clearInterval(elapsedTimer);
  $("task-elapsed").hidden = true;
  elapsedTimer = setInterval(() => {
    const s = Math.floor((Date.now() - jobStart) / 1000);
    if (s >= 5) {
      $("task-elapsed").hidden = false;
      $("task-sec").textContent = fmtElapsed(s);
    }
  }, 1000);
}
function stopElapsed(){ clearInterval(elapsedTimer); }

function setBusy(on, label){
  $("taskcard").hidden = !on;
  if (on && label) $("task-label").textContent = label;
  $("url").disabled = on;
  $("dl-btn").disabled = on;
}
function setFormError(msg){
  if (msg) {
    $("dl-err-text").textContent = msg;
    $("dl-err").hidden = false;
    $("retry-btn").hidden = false;
  } else {
    $("dl-err").hidden = true;
    $("retry-btn").hidden = true;
  }
}

async function startDownload(){
  const url = $("url").value.trim();
  if (!url) return;
  setFormError(null);
  $("result").hidden = true;
  setBusy(true, STATE_LABEL.starting);
  startElapsed();
  try {
    const job = await api("/api/jobs", { url, initData: inTG ? tg.initData : "" });
    state.currentJob = job.id;
    poll(job.id);
  } catch (e) {
    stopElapsed();
    setBusy(false);
    setFormError(e.message);
    haptic("error");
  }
}

// Jobs are pruned after a day; a file link from a pruned job 404s.
// Check liveness before offering the save, and say so honestly.
async function jobAlive(id){
  try { await api("/api/jobs/" + id); return true; } catch (e) { return false; }
}

async function poll(id){
  let job;
  try { job = await api("/api/jobs/" + id); } catch (e) { return; }
  if (job.state === "done") {
    stopElapsed();
    setBusy(false);
    haptic("success");
    showResult(job);
  } else if (job.state === "error") {
    stopElapsed();
    setBusy(false);
    setFormError(job.error || COPY.failed);
    haptic("error");
  } else {
    $("task-label").textContent = STATE_LABEL[job.state] || job.state;
    setTimeout(() => poll(id), 2000);
  }
}

function showResult(job){
  state.result = job;
  $("result-title").textContent = job.title || "video";
  $("result-meta").textContent =
    [job.file_name, job.file_size_mb ? job.file_size_mb + " MB" : null].filter(Boolean).join("  ·  ");
  const link = $("open-link");
  if (job.file_url) { link.href = job.file_url; link.hidden = false; }
  else link.hidden = true;
  // Distinguish the delivery destination (spec §12.4): file_id is set
  // only when a copy actually went out to the chat (authenticated job
  // under the 50 MB bot upload cap).
  $("result-hint").textContent = job.file_id
    ? "A copy was also sent to your chat with the bot."
    : "This file is delivered by the app. Save it from here.";
  $("result").hidden = false;
}

$("dl-btn").addEventListener("click", startDownload);
$("retry-btn").addEventListener("click", startDownload);
$("url").addEventListener("keydown", (e) => { if (e.key === "Enter") startDownload(); });

$("save-btn").addEventListener("click", async () => {
  const job = state.result;
  if (!job) return;
  if (!await jobAlive(job.id)) {
    setFormError(COPY.expired);
    haptic("error");
    return;
  }
  haptic("light");
  if (inTG && typeof tg.downloadFile === "function") {
    tg.downloadFile({ url: job.file_url, file_name: job.file_name || "video.mp4" }, (accepted) => {
      if (!accepted) toast("Download cancelled.");
    });
  } else {
    // browser: Content-Disposition: attachment makes this a plain download
    window.open(job.file_url, "_blank");
  }
});

$("open-link").addEventListener("click", async (e) => {
  const job = state.result;
  if (!job || !job.file_url) return;
  e.preventDefault();
  if (!await jobAlive(job.id)) {
    setFormError(COPY.expired);
    haptic("error");
    return;
  }
  window.open(job.file_url, "_blank");
});

// Mini App -> bot handoff (spec §12.4): the bot accepts the same links
// in chat, so the exit back is a plain chat link — no deep-link claim.
$("open-chat").addEventListener("click", () => {
  haptic("light");
  if (inTG && typeof tg.openTelegramLink === "function") {
    tg.openTelegramLink("https://t.me/harzad_bot");
  } else {
    window.open("https://t.me/harzad_bot", "_blank");
  }
});

// ---- chat tab ---------------------------------------------------------------
function addMsg(role, text){
  state.messages.push({ role, content: text });
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  $("messages").appendChild(div);
  scrollChat();
  return div;
}
function scrollChat(){
  const m = $("main");
  m.scrollTop = m.scrollHeight;
}
// The thinking bubble lives in the DOM only (not in state.messages), so the
// API history never carries placeholder turns.
function addThinking(){
  const div = document.createElement("div");
  div.className = "msg bot";
  div.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  $("messages").appendChild(div);
  scrollChat();
  return div;
}

async function sendChat(){
  const input = $("chat-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMsg("user", text);
  $("send-btn").disabled = true;
  const thinking = addThinking();
  try {
    const data = await api("/api/chat", {
      messages: state.messages,
      initData: inTG ? tg.initData : "",
    });
    const reply = data.reply || "(empty)";
    state.messages.push({ role: "bot", content: reply });
    thinking.textContent = reply;
    haptic("light");
  } catch (e) {
    thinking.textContent = "Chat is unavailable right now: " + e.message;
    haptic("error");
  }
  $("send-btn").disabled = false;
  scrollChat();
}
$("chat-form").addEventListener("submit", (e) => { e.preventDefault(); sendChat(); });

// ---- music tab (plan §12.14) --------------------------------------------------
// The visual library: the same facade views as chat (Latest / Daily /
// Search / Often / Browse), rendered as a cover grid with a per-track
// sheet. Copy aligns with the chat deck (utils/copy.py LIB_*). No
// in-app full playback in v1 — "Get again" delivers the track to the
// chat; the 30s preview plays locally.
const music = {
  view: "latest", sort: "recent", query: "", day: null,
  page: 1, pages: 1, total: 0, days: null,
  busy: false, entered: false, allTracks: [],
};
let sheetTrack = null;
let previewAudio = null;
let previewPlaying = false;
let resendPoll = null;

function trackWord(n){ return n === 1 ? "track" : "tracks"; }

// Mirrors utils.library.relative_time (the API timestamps carry the
// server's UTC offset, so the device timezone parses the same instant).
function relTime(iso){
  if (!iso) return "";
  const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return m + " min ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " h ago";
  return Math.floor(h / 24) + " d ago";
}

function coverSrc(track){
  if (!track.has_cover) return null;
  let src = "/api/library/cover/" + encodeURIComponent(track.track_key);
  if (inTG) src += "?initData=" + encodeURIComponent(tg.initData);
  return src;
}
function letterNode(track){
  const ph = document.createElement("div");
  ph.className = "letter";
  ph.textContent = ((track.artist || track.title || "?").trim()[0] || "?").toUpperCase();
  return ph;
}
function coverNode(track, sheet){
  // img or letter tile; a dead cover URL degrades to the letter tile
  const src = coverSrc(track);
  if (src) {
    const img = document.createElement("img");
    img.className = "cover";
    img.alt = "";
    if (!sheet) img.loading = "lazy";
    img.src = src;
    img.onerror = () => { img.replaceWith(coverNode(track, sheet)); };
    return img;
  }
  return letterNode(track);
}

function tileEl(track, i){
  const t = document.createElement("div");
  t.className = "tile";
  t.style.setProperty("--i", Math.min(i, 12));
  const cw = document.createElement("div");
  cw.className = "coverwrap";
  cw.appendChild(coverNode(track, false));
  if (track.duration) {
    const d = document.createElement("span");
    d.className = "dur num";
    d.textContent = track.duration;
    cw.appendChild(d);
  }
  t.appendChild(cw);
  const tt = document.createElement("div");
  tt.className = "tt";
  tt.textContent = track.title;
  t.appendChild(tt);
  const ta = document.createElement("div");
  ta.className = "ta";
  ta.textContent = track.artist || "";
  t.appendChild(ta);
  t.addEventListener("click", () => { haptic("light"); openSheet(track); });
  return t;
}

function renderGrid(animate){
  const grid = $("track-grid");
  grid.innerHTML = "";
  music.allTracks.forEach((t, i) => {
    const el = tileEl(t, animate ? i : 0);
    if (!animate) el.style.animation = "none";
    grid.appendChild(el);
  });
}

function showSkeleton(){
  const grid = $("track-grid");
  grid.innerHTML = "";
  for (let i = 0; i < 6; i++) {
    const t = document.createElement("div");
    t.className = "skel";
    t.innerHTML = '<div class="sk coverwrap"></div><div class="sk sk-l1"></div><div class="sk sk-l2"></div>';
    grid.appendChild(t);
  }
}

function hideMusicState(){
  $("music-state").hidden = true;
  $("music-state").innerHTML = "";
}
function showMusicState(kind, extra){
  const el = $("music-state");
  el.innerHTML = "";
  let iconName = "music", tone = "soft", t = "", desc = "", retry = false;
  if (kind === "empty") {
    iconName = "music";
    t = "No music saved yet.";
    desc = "Your tracks will appear here automatically when you receive music.";
  } else if (kind === "often-empty") {
    iconName = "clock";
    t = "Often played";
    desc = "Your frequently requested tracks will appear here as you listen again.";
  } else if (kind === "no-results") {
    iconName = "search";
    t = "No matching tracks";
    desc = 'No tracks matched "' + (extra || "") + '". Try another title or artist name.';
  } else if (kind === "unavailable") {
    iconName = "cloud-off"; tone = "warn";
    t = "My music is temporarily unavailable.";
    desc = "Your library data could not be loaded. Please try again shortly.";
    retry = true;
  } else if (kind === "no-auth") {
    iconName = "lock";
    t = "Open the app from Telegram to see your library.";
    desc = "Your music stays private: the library only loads inside Telegram.";
  } else if (kind === "day-empty") {
    iconName = "calendar";
    t = "No tracks on this day.";
    desc = "This day's list is empty.";
  }
  const ico = document.createElement("div");
  ico.className = "state-ico " + tone;
  ico.appendChild(icon(iconName));
  const title = document.createElement("div");
  title.className = "state-t";
  title.textContent = t;
  const d = document.createElement("div");
  d.className = "state-d";
  d.textContent = desc;
  el.appendChild(ico); el.appendChild(title); el.appendChild(d);
  if (retry) {
    const btn = document.createElement("button");
    btn.className = "btn primary";
    btn.textContent = "Try again";
    btn.addEventListener("click", () => loadMusic());
    el.appendChild(btn);
  }
  el.hidden = false;
}

function musicUrl(page){
  const p = new URLSearchParams({ view: music.view, page: String(page) });
  if (music.view === "browse") p.set("sort", music.sort);
  if (music.view === "search") p.set("q", music.query);
  if (music.view === "daily" && music.day) p.set("day", music.day);
  // initData is mandatory on every library call (owner-isolated data);
  // without it the endpoint 401s and the SPA renders the misleading
  // "temporarily unavailable" card (prod incident, 2026-11-24).
  if (inTG) p.set("initData", tg.initData);
  return "/api/library?" + p.toString();
}

function renderDays(data){
  const daysEl = $("day-list");
  daysEl.innerHTML = "";
  for (const d of data.days) {
    const row = document.createElement("button");
    row.className = "dayrow";
    row.type = "button";
    const ic = document.createElement("span");
    ic.className = "dico";
    ic.appendChild(icon("calendar"));
    const mid = document.createElement("div");
    const l = document.createElement("div");
    l.className = "dl";
    l.textContent = d.label;
    const s = document.createElement("div");
    s.className = "ds num";
    s.textContent = d.count + " " + trackWord(d.count);
    mid.appendChild(l); mid.appendChild(s);
    const chev = document.createElement("span");
    chev.className = "chev";
    chev.appendChild(icon("chevron-right"));
    row.appendChild(ic); row.appendChild(mid); row.appendChild(chev);
    row.addEventListener("click", () => {
      haptic("light");
      music.day = d.day;
      loadMusic();
    });
    daysEl.appendChild(row);
  }
}

function renderCount(data){
  const count = $("music-count");
  let text = "";
  if (music.view === "latest") {
    text = data.total + " " + trackWord(data.total) + " saved";
  } else if (music.view === "search") {
    text = "Found " + data.total + " " + trackWord(data.total) + ".";
  } else if (music.view === "often") {
    text = "Often played · " + data.total + " " + trackWord(data.total);
  } else if (music.view === "browse") {
    text = data.total + " " + trackWord(data.total);
  } else { // daily + day
    const label = (music.days || []).find((d) => d.day === data.day);
    text = (label ? label.label : (data.day || "")) + " · "
      + data.total + " " + trackWord(data.total);
  }
  if (data.pages > 1) text += "   Page " + data.page + " of " + data.pages;
  count.textContent = text;
}

function renderMusic(data, append){
  const grid = $("track-grid");
  const daysEl = $("day-list");
  const loadmore = $("load-more");
  const searchErr = $("search-err");
  searchErr.hidden = true;
  searchErr.textContent = "";
  hideMusicState();
  $("day-back").hidden = true;
  daysEl.innerHTML = "";

  if (data.days) music.days = data.days;

  // Daily, no day picked yet: the day list IS the view
  if (music.view === "daily" && !music.day) {
    $("music-count").textContent = "";
    loadmore.hidden = true;
    grid.innerHTML = "";
    music.allTracks = [];
    if (!data.days || data.days.length === 0) { showMusicState("empty"); return; }
    renderDays(data);
    return;
  }

  renderCount(data);

  // states
  if (data.total === 0) {
    grid.innerHTML = "";
    music.allTracks = [];
    loadmore.hidden = true;
    if (music.view === "often") showMusicState("often-empty");
    else if (music.view === "search") showMusicState("no-results", data.query);
    else if (music.view === "daily") showMusicState("day-empty");
    else showMusicState("empty");
    return;
  }

  if (music.view === "daily" && music.day) $("day-back").hidden = false;
  if (append) music.allTracks = music.allTracks.concat(data.tracks);
  else music.allTracks = data.tracks.slice();
  renderGrid(true);
  loadmore.hidden = data.page >= data.pages;
}

async function loadMusic(reset){
  if (music.busy) return;
  if (reset === undefined) reset = true;
  music.busy = true;
  if (reset) { music.page = 1; music.allTracks = []; }
  try {
    const data = await api(musicUrl(reset ? 1 : music.page + 1));
    music.page = data.page;
    music.pages = data.pages;
    music.total = data.total;
    renderMusic(data, !reset);
  } catch (e) {
    $("track-grid").innerHTML = "";
    $("day-list").innerHTML = "";
    $("music-count").textContent = "";
    $("load-more").hidden = true;
    if (music.view === "search" && /2 characters/.test(e.message || "")) {
      $("search-err").hidden = false;
      $("search-err").textContent = e.message;
      hideMusicState();
    } else if (/temporarily unavailable/.test(e.message || "")) {
      showMusicState("unavailable");
    } else if (/Telegram|Unauthorized/.test(e.message || "")) {
      // 401: no/invalid initData — not a transient DB state; "try again"
      // would never help.
      showMusicState("no-auth");
    } else {
      showMusicState("unavailable");
    }
  } finally {
    music.busy = false;
  }
}

function setView(view){
  if (music.view === view) return;
  music.view = view;
  music.day = null;
  document.querySelectorAll("#music-chips .chip").forEach((c) => {
    const on = c.dataset.view === view;
    c.classList.toggle("active", on);
    c.setAttribute("aria-pressed", String(on));
  });
  $("music-sorts").hidden = view !== "browse";
  $("search-box").hidden = view !== "search";
  loadMusic();
}

function runSearch(){
  music.query = $("search-input").value.trim();
  loadMusic();
}

document.querySelectorAll("#music-chips .chip").forEach((c) =>
  c.addEventListener("click", () => { haptic("light"); setView(c.dataset.view); }));
document.querySelectorAll("#music-sorts .chip").forEach((c) =>
  c.addEventListener("click", () => {
    haptic("light");
    if (music.sort === c.dataset.sort) return;
    music.sort = c.dataset.sort;
    document.querySelectorAll("#music-sorts .chip").forEach((x) => {
      const on = x.dataset.sort === music.sort;
      x.classList.toggle("active", on);
      x.setAttribute("aria-pressed", String(on));
    });
    loadMusic();
  }));
$("search-box").addEventListener("submit", (e) => { e.preventDefault(); runSearch(); });
$("day-back").addEventListener("click", () => {
  haptic("light");
  music.day = null;
  loadMusic();
});
$("load-more").addEventListener("click", () => loadMusic(false));

function enterMusic(){
  if (music.entered) return;
  music.entered = true;
  if (!inTG) {
    // the library endpoints require initData — no preview mode (personal data)
    document.querySelector(".chipbar").style.display = "none";
    showMusicState("no-auth");
    return;
  }
  showSkeleton();
  loadMusic();
}

// --- track sheet -------------------------------------------------------------

function setSheetStatus(text, cls){
  const el = $("sheet-status");
  el.className = "sheet-status " + (cls || "");
  el.innerHTML = "";
  if (!text) { el.hidden = true; return; }
  el.hidden = false;
  const icoName = cls === "done" ? "circle-check"
    : cls === "error" ? "alert-circle"
    : cls === "busy" ? "loader-2" : null;
  if (icoName) el.appendChild(icon(icoName));
  const span = document.createElement("span");
  span.textContent = text;
  el.appendChild(span);
}

function setSheetBusy(busy){
  ["sheet-resend", "sheet-preview", "sheet-remove"].forEach((id) =>
    $(id).disabled = busy);
}

function renderSheetMeta(t){
  const stats = [
    ["Duration", t.duration || ""],
    ["Requested", t.request_count <= 1 ? "once" : t.request_count + " times"],
    ["Last requested", relTime(t.last_requested)],
    ["Added", relTime(t.added_on)],
  ].filter((s) => s[1]);
  const el = $("sheet-meta");
  el.innerHTML = "";
  stats.forEach((s) => {
    const cell = document.createElement("div");
    cell.className = "stat";
    const b = document.createElement("b");
    b.textContent = s[0];
    const v = document.createElement("span");
    v.textContent = s[1];
    cell.appendChild(b); cell.appendChild(v);
    el.appendChild(cell);
  });
}

function exitRemoveConfirm(){
  $("sheet-confirm").hidden = true;
  $("sheet-actions").hidden = false;
}

function openSheet(track){
  sheetTrack = track;
  stopPreview();
  clearInterval(resendPoll);
  $("sheet-title").textContent = track.title;
  $("sheet-artist").textContent = track.artist || "";
  const album = $("sheet-album");
  album.hidden = !track.album;
  album.textContent = track.album || "";
  renderSheetMeta(track);
  const wrap = $("sheet-coverwrap");
  wrap.innerHTML = "";
  wrap.appendChild(coverNode(track, true));
  const sp = $("sheet-spotify");
  if (track.spotify_url) {
    sp.href = track.spotify_url;
    sp.hidden = false;
  } else {
    sp.hidden = true;
  }
  exitRemoveConfirm();
  setSheetStatus("");
  $("sheet-backdrop").hidden = false;
  requestAnimationFrame(() => {
    $("sheet-backdrop").classList.add("open");
    $("sheet").classList.add("open");
  });
  $("sheet-x").focus({ preventScroll: true });
}

function closeSheet(){
  $("sheet").classList.remove("open");
  $("sheet-backdrop").classList.remove("open");
  setTimeout(() => {
    if (!$("sheet").classList.contains("open")) {
      $("sheet").hidden = true;
      $("sheet-backdrop").hidden = true;
    }
  }, 300);
  stopPreview();
  clearInterval(resendPoll);
}

$("sheet-backdrop").addEventListener("click", closeSheet);
$("sheet-x").addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("sheet").hidden) closeSheet();
});

$("sheet-resend").addEventListener("click", async () => {
  const key = encodeURIComponent(sheetTrack.track_key);
  setSheetBusy(true);
  setSheetStatus("Sending to your chat…", "busy");
  try {
    const r = await api("/api/library/track/" + key + "/resend",
      { initData: inTG ? tg.initData : "" });
    if (r.state === "sent") {
      setSheetStatus("Sent to your chat", "done");
      haptic("success");
      // the row's count/last-request advanced on the server — keep the
      // sheet honest without a re-fetch
      sheetTrack.request_count += 1;
      sheetTrack.last_requested = new Date().toISOString();
      renderSheetMeta(sheetTrack);
    } else if (r.state === "queued") {
      setSheetStatus("Re-downloading — I'll send it to your chat when ready.", "busy");
      pollResend(key);
    }
  } catch (e) {
    setSheetStatus(e.message, "error");
    haptic("error");
  } finally {
    setSheetBusy(false);
  }
});

function pollResend(key){
  clearInterval(resendPoll);
  const LABEL = {
    resolving: "Looking up the track…",
    downloading: "Downloading…",
    sending: "Sending to chat…",
  };
  resendPoll = setInterval(async () => {
    try {
      let statusUrl = "/api/library/track/" + key + "/resend/status";
      if (inTG) statusUrl += "?initData=" + encodeURIComponent(tg.initData);
      const s = await api(statusUrl);
      if (s.state === "sent") {
        clearInterval(resendPoll);
        setSheetStatus("Sent to your chat", "done");
        haptic("success");
        loadMusic(); // the grid's order may have shifted
      } else if (s.state === "failed") {
        clearInterval(resendPoll);
        setSheetStatus(s.error || "This download failed. Check the link or try again.", "error");
        haptic("error");
      } else {
        setSheetStatus(LABEL[s.state] || "Working…", "busy");
      }
    } catch (e) { /* pruned — leave the last status in place */ }
  }, 2500);
}

$("sheet-preview").addEventListener("click", async () => {
  const key = encodeURIComponent(sheetTrack.track_key);
  setSheetStatus("Loading preview…", "busy");
  try {
    const r = await api("/api/library/track/" + key + "/preview",
      { initData: inTG ? tg.initData : "" });
    playPreview(r.url, sheetTrack);
  } catch (e) {
    setSheetStatus(e.message, "error");
    haptic("error");
  }
});

function playPreview(url, track){
  stopPreview();
  previewAudio = new Audio(url);
  previewPlaying = true;
  $("player-title").textContent = track.title;
  const pb = $("pb-cover");
  const src = coverSrc(track);
  if (src) {
    pb.innerHTML = "";
    const img = document.createElement("img");
    img.alt = "";
    img.src = src;
    img.onerror = () => { pb.innerHTML = ""; pb.appendChild(icon("music")); };
    pb.appendChild(img);
  } else {
    mountIcon(pb, "music");
  }
  mountIcon($("player-toggle"), "player-pause");
  $("player-toggle").setAttribute("aria-label", "Pause");
  $("playerbar").hidden = false;
  previewAudio.play().catch(() => {
    setSheetStatus("Preview playback failed.", "error");
    stopPreview();
  });
  previewAudio.onended = stopPreview;
}
function setPlayerIcon(){
  mountIcon($("player-toggle"), previewPlaying ? "player-pause" : "player-play");
  $("player-toggle").setAttribute("aria-label", previewPlaying ? "Pause" : "Play");
}
function stopPreview(){
  if (previewAudio) { previewAudio.pause(); previewAudio = null; }
  previewPlaying = false;
  $("playerbar").hidden = true;
}
$("player-toggle").addEventListener("click", () => {
  if (!previewAudio) return;
  haptic("light");
  if (previewPlaying) {
    previewAudio.pause();
    previewPlaying = false;
  } else {
    previewAudio.play().catch(() => stopPreview());
    previewPlaying = true;
  }
  setPlayerIcon();
});

$("sheet-remove").addEventListener("click", () => {
  $("sheet-confirm-text").textContent =
    'Remove "' + sheetTrack.title + '" from your library? It does not delete previously sent messages.';
  $("sheet-actions").hidden = true;
  $("sheet-confirm").hidden = false;
});
$("sheet-rm-keep").addEventListener("click", exitRemoveConfirm);
$("sheet-rm-yes").addEventListener("click", async () => {
  const key = encodeURIComponent(sheetTrack.track_key);
  $("sheet-rm-yes").disabled = true;
  try {
    await api("/api/library/track/" + key + "/remove",
      { initData: inTG ? tg.initData : "" });
    toast("Track removed from My music.");
    closeSheet();
    loadMusic();
  } catch (e) {
    setSheetStatus(e.message, "error");
    haptic("error");
  } finally {
    $("sheet-rm-yes").disabled = false;
  }
});
