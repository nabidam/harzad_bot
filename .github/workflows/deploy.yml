name: Deploy

on:
  push:
    branches: [main]

# Never let two deploys race on the same box.
concurrency:
  group: deploy-nl
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The suite runs live against Postgres (tests/conftest.py pins
    # DB_URI to 127.0.0.1:5432/harzad_db), matching the dev box layout.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: baaham
          POSTGRES_PASSWORD: baaham_password
          POSTGRES_DB: harzad_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baaham -d harzad_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        # interpreter pinned by .python-version (3.12.16) — same on dev box, CI, VPS
      - name: Install dependencies
        run: uv sync --frozen
      - name: Create test schema
        run: uv run python scripts/ci_schema.py
      - name: Run tests (live-marked tests excluded by default)
        run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: 185.214.10.121
      DEPLOY_USER: navid
    steps:
      - uses: actions/checkout@v4
      - name: Install deploy key and host key
        env:
          NL_DEPLOY_KEY: ${{ secrets.NL_DEPLOY_KEY }}
          NL_HOST_KEY: ${{ secrets.NL_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$NL_DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$NL_HOST_KEY" > ~/.ssh/known_hosts
      - name: Deploy to nl
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_BRANCH=${GITHUB_REF_NAME} bash ${DEPLOY_USER_HOME}/projects/harzad_bot/scripts/deploy.sh"
        env:
          DEPLOY_USER_HOME: /home/navid
