# Builds the React SPA (web/frontend) and publishes the single inlined
# web/static/index.html on the `webapp-dist` branch. The VPS is node-free
# (HARZAD_WEBAPP_V2_SPEC.md §7): the built file travels through git and
# scripts/deploy.sh rsyncs it into the live web/static/.
name: WebApp

on:
  push:
    branches: [main]
  # Manual re-publish (e.g. after a transient publish failure) — always
  # rebuilds and force-publishes from the current main.
  workflow_dispatch:

# Publishing webapp-dist needs a writable token.
permissions:
  contents: write

# One publisher at a time — webapp-dist is force-pushed, and a second
# interleaved build could publish a stale tree.
concurrency:
  group: webapp-dist
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install
        working-directory: web/frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web/frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: web/frontend
        run: npm test

      - name: Build (single inlined index.html)
        working-directory: web/frontend
        run: npm run build

      - name: Publish webapp-dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The build output is in the working tree; stash it — the
          # checkout below resets the tree and would discard it.
          mkdir -p "$RUNNER_TEMP/webapp"
          cp web/static/index.html "$RUNNER_TEMP/webapp/index.html"
          git fetch origin main
          git checkout -f -B webapp-dist FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/webapp/index.html" web/static/index.html
          git add web/static/index.html
          git commit --allow-empty -m "webapp: build from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" webapp-dist
