[project]
name = "harzad-bot"
version = "0.1.0"
description = "Harzad: Telegram bot built with python-telegram-bot"
# pydub 0.25.1 imports stdlib audioop, removed in 3.13 -> cap at 3.12
requires-python = ">=3.12,<3.13"
license = { text = "The Unlicense" }
dependencies = [
    "python-telegram-bot>=22,<23",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "spotdl>=4.2,<5",
    "validators>=0.34,<0.37",
    "pillow>=10.4",
    "yt-dlp>=2024.12.23",
    "pydub==0.25.1",
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "psycopg2-binary>=2.9.9,<3",
    "instagrapi>=3,<4",
    "requests>=2.32",
    # Bundles the ffmpeg binary, needed at runtime by pydub (mp3 postprocessing)
    "ffmpeg==1.4",
    "aiohttp>=3.14.5",
]

[dependency-groups]
dev = [
    "pylint>=2.12",
    "black>=22.1",
    "isort>=5.10",
    "bandit>=1.7.4",
    "autopep8>=2.0.2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
# App repo: install the dependencies, not the project itself
package = false
