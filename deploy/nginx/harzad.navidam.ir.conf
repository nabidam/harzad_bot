# harzad.navidam.ir — Harzad Telegram bot Mini App
# Host: nl (Ubuntu 24.04, nginx 1.24)
# Install: sudo cp deploy/nginx/harzad.navidam.ir.conf /etc/nginx/sites-available/harzad.navidam.ir
#          sudo ln -sf /etc/nginx/sites-available/harzad.navidam.ir /etc/nginx/sites-enabled/harzad.navidam.ir
#          sudo nginx -t && sudo systemctl reload nginx
#
# Cert: /etc/letsencrypt/live/harzad.navidam.ir (certbot)
# Content: aiohttp server embedded in the bot process (web/app.py),
#          bound to 127.0.0.1:8377 by systemd service harzad-bot.
#          Telegram Mini App menu button -> https://harzad.navidam.ir

# 1. HTTP Server Block (ACME challenge + redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name harzad.navidam.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block (reverse proxy to the bot's embedded web server)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name harzad.navidam.ir;

    ssl_certificate     /etc/letsencrypt/live/harzad.navidam.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harzad.navidam.ir/privkey.pem;

    access_log /var/log/nginx/harzad.navidam.ir.access.log;
    error_log  /var/log/nginx/harzad.navidam.ir.error.log;

    # MP3/video downloads and uploads can be large
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:8377;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Job files stream from disk; keep long-lived connections alive
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
